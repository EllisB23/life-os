.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}

.date{font-size:11px;color:#3A434F}

.big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums}

.best{font-size:12px;color:#3A434F;margin-top:7px}
.atrisk{background:#E5484D12;border:1px solid #E5484D38;border-radius:12px;padding:9px 14px;font-size:12.5px;color:#F0A6A8;text-align:center;margin:13px 0 20px}
.spacer{height:20px}
.seclab{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:#6B7686;text-transform:uppercase;margin:0 0 10px;font-weight:600}
.seclab2{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:#6B7686;text-transform:uppercase;font-weight:600}
.rows{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.rowwrap{display:flex;align-items:stretch;gap:9px}
.row{flex:1;display:flex;align-items:center;gap:13px;text-align:left;background:#151A22;border:1px solid #232B36;border-radius:13px;padding:13px 15px;cursor:pointer;transition:all .15s;color:inherit;font:inherit}
.box{flex-shrink:0;width:23px;height:23px;border:2px solid #3A434F;display:grid;place-items:center;transition:all .15s}
.rowtxt{flex:1}
.rl{display:block;font-size:15px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:#C3CAD4}
.rs{display:block;font-size:12px;color:#6B7686;margin-top:1px}
.info{flex-shrink:0;width:44px;border-radius:13px;background:#151A22;border:1px solid #232B36;color:#6B7686;cursor:pointer;font-size:18px;display:grid;place-items:center;transition:all .15s;font-family:'Space Grotesk',sans-serif}
.detail{background:#1B212B;border:1px solid #232B36;border-radius:14px;padding:16px;margin-bottom:16px}

.plist{list-style:none}

<script>
const KEY = "life-os-v1";
const C = {
  sleep:"#6E7BF2", walk:"#2DD4A7", aim:"#7B4DFF", run:"#F5A33C", strength:"#F2645C",
  walkBg:"#2DD4A7", sleepBg:"#6E7BF2"
};
const ANCHORS = [
  {key:"sleep", label:"Sleep window", sub:"In bed 10:45 · up 7:00", color:C.sleep},
  {key:"walk",  label:"Daily walk",   sub:"Baseline + ~3k steps",   color:C.walk},
  {key:"aim",   label:"Aim — 20 min min", sub:"Warm up → session → stretch", color:C.aim, detail:"aim"},
];
const BONUS = [
  {key:"run",      label:"Run", sub:"Occasional — bonus", color:C.run},
  {key:"strength", label:"Wrist strength block", sub:"Loaded · own block · 2–3×/wk", color:C.strength, detail:"strength"},
];

const pad = n => String(n).padStart(2,"0");
const iso = d => { const x=new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const today = () => iso(new Date());
const addDays = (s,n) => { const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return iso(dt); };
const chainDone = e => !!(e && e.sleep && e.walk && e.aim);

let log = {};
let openDetail = null;
try { log = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ log = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(log)); } catch(e){} };

function streaks(){
  const t = today();
  const todayDone = chainDone(log[t]);
  let streak = 0, cur = todayDone ? t : addDays(t,-1);
  while (chainDone(log[cur])) { streak++; cur = addDays(cur,-1); }
  let best = 0;
  const days = Object.keys(log).filter(d=>chainDone(log[d])).sort();
  let run=0, prev=null;
  for (const d of days){ run = (prev && addDays(prev,1)===d) ? run+1 : 1; best=Math.max(best,run); prev=d; }
  best = Math.max(best, streak);
  return { streak, best, todayDone };
}

const check = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B0E13" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

function row(a, on, square){
  const shape = square ? "6px" : "50%";
  const box = `<span class="box" style="border-radius:${shape};border-color:${on?a.color:'#3A434F'};background:${on?a.color:'transparent'}">${on?check:""}</span>`;
  const info = a.detail
    ? `<button class="info ${openDetail===a.detail?'open':''}" data-act="detail" data-detail="${a.detail}" aria-label="details" style="${openDetail===a.detail?`color:${a.color};border-color:${a.color}55;background:${a.color}1A`:''}">${openDetail===a.detail?'−':'i'}</button>`
    : "";
  return `<div class="rowwrap">
    <button class="row" data-act="toggle" data-key="${a.key}" style="${on?`background:${a.color}12;border-color:${a.color}66`:''}">
      ${box}
      <span class="rowtxt"><span class="rl" style="${on?'color:#E6EAF0':''}">${a.label}</span><span class="rs">${a.sub}</span></span>
    </button>${info}</div>`;
}

function phase(tag,color,title,items,note){
  const lis = items.map(it=>`<li style="border-color:${color}55"><span>${it.n}</span><span class="d">${it.d}</span></li>`).join("");
  return `<div class="phase">
    <div class="phead"><span class="ptag" style="background:${color}">${tag}</span><span class="ptitle">${title}</span></div>
    <ul class="plist">${lis}</ul>${note?`<div class="pnote">${note}</div>`:""}</div>`;
}

const aimDetail = () => `<div class="detail">
  <div class="dlabel" style="color:${C.aim}">How the session runs</div>
  ${phase("BEFORE",C.sleep,"Light warm-up · 2 rounds",[
    {n:"Wrist curls · palm up",d:"30s"},{n:"Reverse curls · palm down",d:"30s"},
    {n:"Sideways tilts · hammer",d:"30s"},{n:"Band openings",d:"30s"},{n:"Grip-tool flexes",d:"30s"}],
    "Light & dynamic only — blood flow, not burn. Forearm supported, wrist only.")}
  ${phase("SESSION",C.aim,"Aim · 20 min minimum",[
    {n:"Clicking — lead here (weak area)",d:"CRISP"},{n:"Tracking — stay loose",d:"SMOOTH"}],
    "Pull the actual scenarios from your training-routine poster.")}
  ${phase("AFTER",C.run,"Stretch · right after only",[
    {n:"Flexor stretch — palm out, fingers up",d:"15s ×3"},{n:"Extensor stretch — palm down, fingers down",d:"15s ×3"}],
    "Static stretches go after, never before. Mild tension only — stop on sharp pain, numbness or tingling.")}
</div>`;

const strengthDetail = () => `<div class="detail">
  <div class="dlabel" style="color:${C.strength}">Own block · rest days or end of day</div>
  <p class="dp">The loaded dumbbell work — heavier than the warm-up. Kept separate so it never dulls fine-aim control right before a session.</p>
  ${phase("LOAD",C.strength,"2–3 kg → progress",[
    {n:"Wrist curls · palm up",d:"2–3 sets"},{n:"Reverse curls · palm down",d:"2–3 sets"},{n:"Hammer tilts",d:"2–3 sets"}],
    "2–3×/week. Forearm supported, controlled tempo. Tick the box on days you do it.")}
</div>`;

function render(){
  const t = today();
  const e = log[t] || {};
  const {streak,best,todayDone} = streaks();
  const dateStr = new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});

  const grid = Array.from({length:60},(_,i)=>addDays(t,-(59-i))).map(d=>{
    const en = log[d]; const done = chainDone(en);
    const partial = en && (en.sleep||en.walk||en.aim) && !done;
    const isT = d===t;
    const bg = done ? C.walk : partial ? `${C.sleep}4D` : "#151A22";
    const bd = isT ? `1.5px solid ${C.walk}` : "1px solid #232B36";
    const runDot = en&&en.run ? `<span class="cd" style="left:3px;background:${C.run}"></span>`:"";
    const strDot = en&&en.strength ? `<span class="cd" style="right:3px;background:${C.strength}"></span>`:"";
    return `<button class="cell" data-act="grid" data-date="${d}" style="background:${bg};border:${bd}" aria-label="${d}">${runDot}${strDot}</button>`;
  }).join("");

  const mp = t.slice(0,7);
  const month = Object.entries(log).filter(([d])=>d.startsWith(mp));
  const cnt = k => month.filter(([,x])=>x[k]).length;
  const stat = (n,l,c)=>`<div class="stat"><div class="sn" style="color:${c}">${n}</div><div class="sl">${l}</div></div>`;

  document.getElementById("app").innerHTML = `
    <div class="head">
      <span class="brand">Life · Operating System</span>
      <span class="date">${dateStr}</span>
    </div>
    <div class="hero">
      <div class="big" style="color:${streak>0?'#E6EAF0':'#3A434F'};text-shadow:${streak>0?`0 0 26px ${C.walk}40`:'none'}">${streak}</div>
      <div class="biglab">Day Chain</div>
      <div class="best">Best · ${best} ${best===1?'day':'days'}</div>
    </div>
    ${ todayDone
      ? `<div class="spacer"></div>`
      : `<div class="atrisk">Today isn't locked in — all three anchors green keeps the chain alive.</div>` }

    <div class="seclab">Daily anchors</div>
    <div class="rows">${ANCHORS.map(a=>row(a,!!e[a.key],false)).join("")}</div>
    ${openDetail==="aim"?aimDetail():""}

    <div class="seclab">Bonus · never breaks the chain</div>
    <div class="rows">${BONUS.map(a=>row(a,!!e[a.key],true)).join("")}</div>
    ${openDetail==="strength"?strengthDetail():""}

    <div class="gridhead"><span class="seclab2">Last 60 days</span><span class="hint">tap to fix a missed log</span></div>
    <div class="grid">${grid}</div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:${C.walk}"></span>chain day</span>
      <span class="lg"><span class="sw" style="background:${C.sleep}88"></span>partial</span>
      <span class="lg"><span class="sw dot" style="background:${C.run}"></span>run</span>
      <span class="lg"><span class="sw dot" style="background:${C.strength}"></span>strength</span>
    </div>

    <div class="seclab">This month</div>
    <div class="stats">
      ${stat(cnt("sleep"),"Sleep",C.sleep)}${stat(cnt("walk"),"Walks",C.walk)}${stat(cnt("aim"),"Aim",C.aim)}${stat(cnt("run"),"Runs",C.run)}${stat(cnt("strength"),"Strength",C.strength)}
    </div>
    <div class="backup">
      <button class="bk" data-act="export">&#8595; Export backup</button>
      <button class="bk" data-act="import">&#8593; Import backup</button>
    </div>
    <div class="foot">Loose wrist. Quiet hand. Clean chain.</div>
  `;
}

document.getElementById("app").addEventListener("click", (ev)=>{
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, t = today();
  if(act==="toggle"){
    const k = el.dataset.key; log[t] = {...(log[t]||{})}; log[t][k] = !log[t][k]; save(); render();
  } else if(act==="detail"){
    openDetail = openDetail===el.dataset.detail ? null : el.dataset.detail; render();
  } else if(act==="grid"){
    const d = el.dataset.date; const e = log[d]||{};
    const k = !e.sleep?"sleep":!e.walk?"walk":!e.aim?"aim":"sleep";
    log[d] = {...e}; log[d][k] = !log[d][k]; save(); render();
  } else if(act==="export"){
    const blob = new Blob([JSON.stringify(log,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="life-os-backup-"+today()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  } else if(act==="import"){
    document.getElementById("file").click();
  }
});

document.getElementById("file").addEventListener("change", (ev)=>{
  const f = ev.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if(data && typeof data==="object" && !Array.isArray(data)){
        log = {...log, ...data}; save(); render(); alert("Backup restored.");
      } else { alert("That file isn't a valid backup."); }
    } catch(e){ alert("That file couldn't be read as a backup."); }
    ev.target.value="";
  };
  reader.readAsText(f);
});

render();
</script>
</body>
</html>
